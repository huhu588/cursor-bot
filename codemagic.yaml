# Codemagic：在 macOS 机器上把本工具打成 Mac 可用的 .app / .dmg
# 用法：Codemagic 连接本仓库后，选 macos-build 工作流构建；产物在 Artifacts 里下载。
# 与 .github/workflows/build.yml 的 macos 任务步骤一致，二选一即可。
workflows:
  macos-build:
    name: Infinity macOS (.app + .dmg)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        APP_NAME: "Infinity"
        APP_VERSION: "2.3.5"
    scripts:
      - name: 安装 Python 依赖（含 mac 的 pyobjc）
        script: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit pyobjc-framework-Quartz
      - name: 生成 .icns 图标
        script: |
          set -euo pipefail
          SRC="web/infinity-icon.png"
          ICONSET="icon.iconset"
          rm -rf "$ICONSET" && mkdir -p "$ICONSET"
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC" --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s*2)); sips -z $d $d "$SRC" --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o icon.icns
      - name: Nuitka 编译为 .app
        script: |
          set -euo pipefail
          python3 -m nuitka --standalone --assume-yes-for-downloads \
            --macos-create-app-bundle \
            --macos-app-name="$APP_NAME" \
            --macos-app-icon=icon.icns \
            --macos-app-version="$APP_VERSION" \
            --enable-plugin=pywebview \
            --nofollow-import-to=sand_rpc --nofollow-import-to=httpx \
            --nofollow-import-to=PIL --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest --nofollow-import-to=doctest \
            --nofollow-import-to=pydoc --nofollow-import-to=lib2to3 \
            --nofollow-import-to=setuptools --nofollow-import-to=pip \
            --nofollow-import-to=pytest --nofollow-import-to=test \
            --include-data-dir=web=web \
            --company-name="$APP_NAME" --product-name="$APP_NAME" \
            --product-version="$APP_VERSION" --file-version="$APP_VERSION.0" \
            --output-filename="$APP_NAME" \
            --output-dir=build-mac \
            app.py
          cd build-mac
          BUILT=$(ls -d *.app | head -n1)
          [ "$BUILT" = "$APP_NAME.app" ] || mv "$BUILT" "$APP_NAME.app"
      - name: 签名并打成 DMG
        script: |
          set -euo pipefail
          cd build-mac
          # ad-hoc 签名，减少本机 Gatekeeper 拦截；正式分发需 Apple 开发者证书 + 公证
          codesign --force --deep --sign - "$APP_NAME.app"
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_NAME.app" -ov -format UDZO "$APP_NAME-$APP_VERSION-macos-arm64.dmg"
    artifacts:
      - build-mac/*.dmg
